<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sangam Cables – Goods Receipt</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root { --bg:#f0ece4; --red:#B91C1C; --dark:#111; --muted:#777; --border:#ddd; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Rajdhani',sans-serif; background:var(--bg); min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:30px 16px 60px; }
  h1.app-title { font-size:12px; letter-spacing:4px; text-transform:uppercase; color:var(--muted); margin-bottom:24px; text-align:center; }
  .form-card { background:white; border:1px solid var(--border); border-radius:4px; padding:26px; width:100%; max-width:520px; box-shadow:0 2px 12px rgba(0,0,0,0.07); margin-bottom:24px; }
  .form-card h2 { font-size:17px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--red); margin-bottom:20px; border-bottom:2px solid var(--red); padding-bottom:8px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:13px; }
  .span2 { grid-column:span 2; }
  label { display:block; font-size:10px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
  input,select,textarea { width:100%; padding:8px 11px; border:1.5px solid var(--border); border-radius:3px; font-family:'Rajdhani',sans-serif; font-size:14px; color:var(--dark); background:#fafaf8; transition:border-color 0.2s; outline:none; }
  input:focus,select:focus,textarea:focus { border-color:var(--red); background:white; }
  textarea { resize:vertical; min-height:56px; font-size:13px; }
  .weight-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:13px; margin-top:13px; }
  .net-display { background:var(--dark); color:#fff; padding:8px 11px; border-radius:3px; font-family:'Share Tech Mono',monospace; font-size:17px; text-align:center; min-height:38px; display:flex; align-items:center; justify-content:center; letter-spacing:1px; }
  .net-label { color:#B45309; font-size:10px; letter-spacing:2px; text-transform:uppercase; margin-bottom:4px; font-weight:600; }
  .btn-generate { width:100%; padding:13px; background:var(--red); color:white; border:none; border-radius:3px; font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:700; letter-spacing:3px; text-transform:uppercase; cursor:pointer; margin-top:18px; transition:background 0.2s; }
  .btn-generate:hover { background:#991b1b; }
  #receipt-area { width:100%; max-width:520px; display:none; }
  .receipt-page { background:white; border:1px solid #ccc; border-radius:3px; padding:24px; display:flex; flex-direction:column; align-items:center; gap:24px; box-shadow:0 4px 20px rgba(0,0,0,0.1); }
  .receipt { width:280px; font-family:'Share Tech Mono',monospace; font-size:11.5px; color:#111; background:white; padding:18px 16px 22px; border:1px dashed #bbb; position:relative; }
  .receipt::before,.receipt::after { content:''; display:block; height:8px; background:repeating-linear-gradient(90deg,white 0px,white 6px,var(--bg) 6px,var(--bg) 10px); position:absolute; left:0; right:0; }
  .receipt::before { top:-8px; } .receipt::after { bottom:-8px; }
  .r-center { text-align:center; }
  .r-company { font-family:'Rajdhani',sans-serif; font-size:18px; font-weight:700; letter-spacing:1px; text-transform:uppercase; }
  .r-subtitle { font-size:9.5px; letter-spacing:2px; color:#555; text-transform:uppercase; margin-top:2px; }
  .r-divider { border:none; border-top:1px dashed #999; margin:10px 0; }
  .r-divider-solid { border:none; border-top:1px solid #333; margin:10px 0; }
  .r-row { display:flex; justify-content:space-between; margin:3px 0; font-size:11px; }
  .r-label { color:#555; flex-shrink:0; }
  .r-value { text-align:right; word-break:break-word; margin-left:8px; }
  .r-section-title { font-size:9px; letter-spacing:2px; text-transform:uppercase; color:#999; margin:8px 0 4px; }
  .r-weight-block { border:1px solid #ddd; padding:8px 10px; margin:8px 0; border-radius:2px; }
  .r-net-line { display:flex; justify-content:space-between; align-items:baseline; border-top:1px solid #333; margin-top:6px; padding-top:5px; }
  .r-net-label { font-size:12px; font-weight:bold; letter-spacing:1px; }
  .r-net-val { font-size:18px; font-weight:bold; letter-spacing:1px; }
  .r-stamp { text-align:center; margin:12px 0 4px; padding:6px; border:2px solid #111; font-family:'Rajdhani',sans-serif; font-size:13px; font-weight:700; letter-spacing:3px; text-transform:uppercase; }
  .r-sig { display:flex; justify-content:space-between; margin-top:18px; gap:14px; }
  .r-sig-box { flex:1; text-align:center; }
  .r-sig-line { border-top:1px solid #333; margin-bottom:4px; margin-top:20px; }
  .r-sig-lbl { font-size:8.5px; letter-spacing:1px; text-transform:uppercase; color:#777; }
  .r-footer { text-align:center; margin-top:12px; font-size:9.5px; color:#aaa; letter-spacing:1px; }
  .action-row { display:flex; gap:12px; margin-top:20px; width:100%; }
  .btn-action { flex:1; padding:12px; border:none; border-radius:3px; font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:700; letter-spacing:2px; text-transform:uppercase; cursor:pointer; transition:background 0.2s; }
  .btn-new { background:white; color:var(--red); border:2px solid var(--red); }
  .btn-new:hover { background:#fff5f5; }
  .btn-pdf { background:#111; color:white; }
  .btn-pdf:hover { background:#333; }
  @media print { body { display:none; } }
</style>
</head>
<body>

<h1 class="app-title">📦 Goods Receipt Generator</h1>

<div class="form-card" id="form-card">
  <h2>Receipt Details</h2>
  <div class="grid2">
    <div class="span2">
      <label>Company Name</label>
      <input type="text" id="companyName" value="Sangam Cables"/>
    </div>
    <div>
      <label>Invoice No.</label>
      <input type="text" id="receiptNo" placeholder="INV-0001"/>
    </div>
    <div>
      <label>Date & Time</label>
      <input type="datetime-local" id="datetime"/>
    </div>
    <div class="span2">
      <label>Supplier / Party Name</label>
      <input type="text" id="party" placeholder="e.g. Vietnam Minerals Co."/>
    </div>
    <div class="span2">
      <label>Material / Goods Description</label>
      <input type="text" id="material" placeholder="e.g. Calcium Carbonate – Grade A"/>
    </div>
    <div>
      <label>Received By</label>
      <input type="text" id="receiver" placeholder="e.g. Ramesh Singh"/>
    </div>
    <div>
      <label>Unit</label>
      <select id="unit">
        <option value="KG">KG</option>
        <option value="MT" selected>MT</option>
        <option value="Quintal">Quintal</option>
      </select>
    </div>
    <div class="span2">
      <label>Remarks (optional)</label>
      <textarea id="remarks" placeholder="e.g. Goods received in good condition."></textarea>
    </div>
  </div>

  <div class="weight-row" style="grid-template-columns:1fr 1fr; margin-bottom:10px;">
    <div>
      <label>Net Weight</label>
      <input type="number" id="net" placeholder="0" oninput="calcWeights()"/>
    </div>
    <div>
      <label>% for Gross &amp; Tare</label>
      <div style="display:flex;align-items:center;gap:8px;">
        <input type="number" id="pct" value="0.32" step="0.01" min="0" style="width:80px;" oninput="calcWeights()"/>
        <span style="font-size:12px;color:var(--muted);white-space:nowrap;">% of net</span>
      </div>
    </div>
  </div>

  <div class="weight-row">
    <div>
      <div class="net-label">Gross Weight</div>
      <div class="net-display" id="grossDisplay" style="font-size:14px;">—</div>
    </div>
    <div>
      <div class="net-label">Tare Weight</div>
      <div class="net-display" id="tareDisplay" style="font-size:14px;">—</div>
    </div>
    <div>
      <div class="net-label" style="color:#86efac;">Net Weight</div>
      <div class="net-display" id="netDisplay" style="background:#14532d;">—</div>
    </div>
  </div>

  <div class="grid2" style="margin-top:13px;">
    <div>
      <label>No. of copies</label>
      <select id="copies">
        <option value="1">1 copy</option>
        <option value="2" selected>2 copies</option>
        <option value="3">3 copies</option>
      </select>
    </div>
    <div>
      <label>Thermal Roll Width</label>
      <select id="rollWidth">
        <option value="58">58 mm</option>
        <option value="72" selected>72 mm</option>
        <option value="80">80 mm</option>
      </select>
    </div>
  </div>

  <button class="btn-generate" onclick="generateReceipt()">Generate Receipt →</button>
</div>

<div id="receipt-area">
  <div class="receipt-page" id="receipt-page"></div>
  <div class="action-row">
    <button class="btn-action btn-new" onclick="newReceipt()">← New Receipt</button>
    <button class="btn-action btn-pdf" onclick="downloadPDF()">⬇ Download PDF</button>
  </div>
</div>

<script>
const now = new Date();
const pad = n => String(n).padStart(2,'0');
document.getElementById('datetime').value =
  `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;

let counter = parseInt(localStorage.getItem('inv_counter') || '0') + 1;
document.getElementById('receiptNo').value = 'INV-' + String(counter).padStart(4,'0');

function calcWeights() {
  const net = parseFloat(document.getElementById('net').value) || 0;
  const pct = parseFloat(document.getElementById('pct').value) || 0;
  if (net > 0) {
    const tare = net * pct / 100, gross = net + tare;
    document.getElementById('grossDisplay').textContent = gross.toFixed(3);
    document.getElementById('tareDisplay').textContent  = tare.toFixed(3);
    document.getElementById('netDisplay').textContent   = net.toFixed(3);
  } else {
    ['grossDisplay','tareDisplay','netDisplay'].forEach(id =>
      document.getElementById(id).textContent = '—');
  }
}

// Copy labels: 1 copy = DUPLICATE only, 2 copies = DUPLICATE + ORIGINAL, 3 = DUPLICATE + ORIGINAL + TRIPLICATE
function getCopyLabels(n) {
  const all = ['DUPLICATE', 'ORIGINAL', 'TRIPLICATE'];
  return all.slice(0, n);
}

let currentData = null;
function gatherData() {
  const net  = parseFloat(document.getElementById('net').value) || 0;
  const pct  = parseFloat(document.getElementById('pct').value) || 0;
  const tare = net * pct / 100, gross = net + tare;
  const dtVal = document.getElementById('datetime').value;
  let dateStr = '', timeStr = '';
  if (dtVal) {
    const d = new Date(dtVal);
    dateStr = d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
    timeStr = d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  }
  return {
    company  : document.getElementById('companyName').value.trim() || 'Company',
    receiptNo: document.getElementById('receiptNo').value.trim()   || 'GRN-0001',
    date: dateStr, time: timeStr,
    party    : document.getElementById('party').value.trim()    || '—',
    material : document.getElementById('material').value.trim() || '—',
    receiver : document.getElementById('receiver').value.trim() || '—',
    unit     : document.getElementById('unit').value,
    gross    : gross.toFixed(3),
    tare     : tare.toFixed(3),
    net      : net > 0 ? net.toFixed(3) : '0.000',
    remarks  : document.getElementById('remarks').value.trim(),
    copies   : parseInt(document.getElementById('copies').value),
    rollWidth: parseInt(document.getElementById('rollWidth').value),
  };
}

function buildPreview(data, copyLabel) {
  const r = document.createElement('div');
  r.className = 'receipt';
  r.innerHTML = `
    <div class="r-center">
      <div class="r-company">${data.company}</div>
      <div class="r-subtitle">Goods Received Note</div>
    </div>
    <hr class="r-divider-solid"/>
    <div class="r-row"><span class="r-label">Invoice No.</span><span class="r-value">${data.receiptNo}</span></div>
    <div class="r-row"><span class="r-label">Date</span><span class="r-value">${data.date}</span></div>
    <div class="r-row"><span class="r-label">Time</span><span class="r-value">${data.time}</span></div>
    <hr class="r-divider"/>
    <div class="r-section-title">Supplier Details</div>
    <div class="r-row"><span class="r-label">Party</span><span class="r-value">${data.party}</span></div>
    <div class="r-row"><span class="r-label">Material</span><span class="r-value">${data.material}</span></div>
    <div class="r-row"><span class="r-label">Received By</span><span class="r-value">${data.receiver}</span></div>
    <hr class="r-divider"/>
    <div class="r-section-title">Weight Details</div>
    <div class="r-weight-block">
      <div class="r-row"><span class="r-label">Gross Wt.</span><span class="r-value">${data.gross} ${data.unit}</span></div>
      <div class="r-row"><span class="r-label">Tare Wt.</span><span class="r-value">${data.tare} ${data.unit}</span></div>
      <div class="r-net-line">
        <span class="r-net-label">NET WT.</span>
        <span class="r-net-val">${data.net} ${data.unit}</span>
      </div>
    </div>
    ${data.remarks ? `<hr class="r-divider"/><div class="r-section-title">Remarks</div><div style="font-size:10.5px;line-height:1.5;margin-bottom:6px;">${data.remarks}</div>` : ''}
    <div class="r-stamp">GOODS RECEIVED</div>
    <div class="r-sig">
      <div class="r-sig-box"><div class="r-sig-line"></div><div class="r-sig-lbl">Received By</div></div>
      <div class="r-sig-box"><div class="r-sig-line"></div><div class="r-sig-lbl">Supplier / Driver</div></div>
    </div>
    <div class="r-footer">
      <div style="margin-top:10px;font-size:9px;border-top:1px dashed #ccc;padding-top:6px;">${copyLabel} | ${data.receiptNo}</div>
    </div>`;
  return r;
}

function generateReceipt() {
  currentData = gatherData();
  const labels = getCopyLabels(currentData.copies);
  const page = document.getElementById('receipt-page');
  page.innerHTML = '';
  for (let i = 0; i < currentData.copies; i++)
    page.appendChild(buildPreview(currentData, labels[i]));
  localStorage.setItem('inv_counter', counter);
  counter++;
  document.getElementById('receiptNo').value = 'INV-' + String(counter).padStart(4,'0');
  document.getElementById('form-card').style.display   = 'none';
  document.getElementById('receipt-area').style.display = 'block';
}

function newReceipt() {
  document.getElementById('form-card').style.display   = 'block';
  document.getElementById('receipt-area').style.display = 'none';
}

// ─────────────────────────────────────────────────────
// PDF ENGINE
// ─────────────────────────────────────────────────────
function drawReceipt(doc, d, copyLabel, W, M, startY) {
  const CW = W - M * 2;
  let y = startY;

  const sf = (style, size) => { doc.setFont('Courier', style); doc.setFontSize(size); };

  const dashedLine = (yPos) => {
    doc.setLineDashPattern([0.8, 0.8], 0);
    doc.setLineWidth(0.5);
    doc.line(M, yPos, W - M, yPos);
    doc.setLineDashPattern([], 0);
    doc.setLineWidth(0.5);
  };

  const solidLine = (yPos, lw) => {
    doc.setLineDashPattern([], 0);
    doc.setLineWidth(lw || 0.5);
    doc.line(M, yPos, W - M, yPos);
    doc.setLineWidth(0.5);
  };

  // Left-right row — bold throughout
  const lrRow = (left, right, fs) => {
    const lW = CW * 0.40;
    const rW = CW * 0.57;
    sf('bold', fs);
    const lLines = doc.splitTextToSize(String(left),  lW);
    const rLines = doc.splitTextToSize(String(right), rW);
    const count  = Math.max(lLines.length, rLines.length);
    const lh     = fs * 0.38;
    doc.setTextColor(0);
    doc.text(lLines, M, y);
    doc.setTextColor(0);
    doc.text(rLines, W - M, y, { align: 'right' });
    y += count * lh + 1.5;
  };

  const secTitle = (t) => {
    sf('bold', 6);
    doc.setTextColor(0);
    doc.text(t.toUpperCase(), M, y);
    doc.setTextColor(0);
    y += 4;
  };

  // ── Header ──────────────────────────────────────────
  sf('bold', 13);
  const cLines = doc.splitTextToSize(d.company.toUpperCase(), CW);
  doc.text(cLines, W / 2, y, { align: 'center' });
  y += cLines.length * 13 * 0.38 + 1.5;

  sf('bold', 7);
  doc.setTextColor(0);
  doc.text('GOODS RECEIVED NOTE', W / 2, y, { align: 'center' });
  doc.setTextColor(0);
  y += 4.5;

  solidLine(y, 0.5); y += 4;

  // ── Meta ────────────────────────────────────────────
  lrRow('Invoice No.', d.receiptNo, 8);
  lrRow('Date',        d.date,      8);
  lrRow('Time',        d.time,      8);
  y += 0.5;
  dashedLine(y); y += 4;

  // ── Supplier ────────────────────────────────────────
  secTitle('Supplier Details');
  lrRow('Party',       d.party,    8);
  lrRow('Material',    d.material, 8);
  lrRow('Received By', d.receiver, 8);
  y += 0.5;
  dashedLine(y); y += 4;

  // ── Weight block ─────────────────────────────────────
  secTitle('Weight Details');

  // Measure content height first, then draw box around it
  const boxPadV = 2;
  const boxTop  = y - boxPadV;

  lrRow('Gross Wt.', d.gross + ' ' + d.unit, 8);

  // Inner divider
  solidLine(y, 0.35); y += 3;

  // NET WT — shrink font until it fits in one line
  const netStr = d.net + ' ' + d.unit;
  let netFs = 13;
  sf('bold', netFs);
  const labelW = doc.getTextWidth('NET WT.  ');
  while (netFs > 7 && (labelW + doc.getTextWidth(netStr)) > CW - 1) {
    netFs -= 0.5;
    doc.setFontSize(netFs);
  }
  // Draw NET WT label
  sf('bold', 8);
  doc.setTextColor(0);
  doc.text('NET WT.', M, y);
  // Draw value right-aligned at same baseline
  sf('bold', netFs);
  doc.text(netStr, W - M, y, { align: 'right' });
  // Advance y by the taller of the two font sizes
  const netLineH = Math.max(8, netFs) * 0.42;
  y += netLineH + 2;

  // Draw box — exactly wrapping content, no extra space
  const boxBot = y + boxPadV;
  doc.setLineWidth(0.6);
  doc.rect(M, boxTop, CW, boxBot - boxTop);
  doc.setLineWidth(0.5);
  y = boxBot + 3;

  // ── Remarks ─────────────────────────────────────────
  if (d.remarks) {
    dashedLine(y); y += 4;
    secTitle('Remarks');
    sf('bold', 7);
    const rmLines = doc.splitTextToSize(d.remarks.toUpperCase(), CW);
    doc.text(rmLines, M, y);
    y += rmLines.length * 7 * 0.38 + 2;
  }

  y += 3;

  // ── GOODS RECEIVED stamp ─────────────────────────────
  // Fit text: shrink letter spacing by reducing font until width < CW - padding
  const stampPadH = 2.5;  // horizontal inner padding each side
  const stampPadV = 2;    // vertical inner padding
  const stampText = 'GOODS RECEIVED';
  let stampFs = 10;
  sf('bold', stampFs);
  while (stampFs > 6 && doc.getTextWidth(stampText) > CW - stampPadH * 2) {
    stampFs -= 0.2;
    doc.setFontSize(stampFs);
  }
  const stampTextH = stampFs * 0.38;
  const stampBoxH  = stampTextH + stampPadV * 2 + 1;

  doc.setLineWidth(0.7);
  doc.rect(M, y, CW, stampBoxH);
  doc.setLineWidth(0.5);
  sf('bold', stampFs);
  doc.setTextColor(0);
  doc.text(stampText, W / 2, y + stampPadV + stampTextH, { align: 'center' });
  y += stampBoxH + 5;

  // ── Signature lines ──────────────────────────────────
  const mid = W / 2;
  doc.setLineWidth(0.5);
  doc.line(M,       y, mid - 3, y);
  doc.line(mid + 3, y, W - M,   y);
  y += 3;
  sf('bold', 6);
  doc.setTextColor(0);
  doc.text('RECEIVED BY',       M + (mid - 3 - M) / 2,           y, { align: 'center' });
  doc.text('SUPPLIER / DRIVER', mid + 3 + (W - M - mid - 3) / 2, y, { align: 'center' });
  doc.setTextColor(0);
  y += 5;

  // ── Footer ───────────────────────────────────────────
  dashedLine(y); y += 3;
  sf('bold', 6.5);
  doc.setTextColor(0);
  doc.text(copyLabel + '  |  ' + d.receiptNo, W / 2, y, { align: 'center' });
  doc.setTextColor(0);
  y += 4;

  return y;
}

function downloadPDF() {
  if (!currentData) return;
  const { jsPDF } = window.jspdf;
  const W      = currentData.rollWidth;
  const M      = W === 58 ? 3 : W === 72 ? 4 : 4;
  const copies = currentData.copies;
  const labels = getCopyLabels(copies);
  const GAP    = 8;

  const probe = new jsPDF({ unit: 'mm', format: [W, 2000] });
  let yP = 4;
  for (let i = 0; i < copies; i++) {
    yP = drawReceipt(probe, currentData, labels[i], W, M, yP);
    if (i < copies - 1) yP += GAP;
  }
  const totalH = yP + 5;

  // Pass 2 — render
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: [W, totalH] });
  let y = 4;
  for (let i = 0; i < copies; i++) {
    y = drawReceipt(doc, currentData, labels[i], W, M, y);
    if (i < copies - 1) {
      doc.setLineDashPattern([1.2, 1.2], 0);
      doc.setLineWidth(0.2);
      doc.line(M, y + 2, W - M, y + 2);
      doc.setLineDashPattern([], 0);
      doc.setFont('Courier', 'normal');
      doc.setFontSize(5);
      doc.setTextColor(0);
      doc.text('- - - CUT HERE - - -', W / 2, y + 5, { align: 'center' });
      doc.setTextColor(0);
      y += GAP;
    }
  }

  doc.save(currentData.receiptNo + '.pdf');
}
</script>
</body>
</html>
